<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบจองคิวคลินิกออนไลน์</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #F5F9FC;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* ส่วนหัว */
header {
    background: linear-gradient(135deg, #0D47A1, #1976D2);
    padding: 40px 20px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,.15);
}

header h1 {
    color: #FFFFFF;
    font-size: 38px;
    margin: 0;
    font-weight: 700;
}

header p {
    color: #E3F2FD;
    font-size: 18px;
    margin-top: 10px;
}

/* กล่องฟอร์ม */
.container {
    background: #FFFFFF;
    border-radius: 18px;
    padding: 35px;
    margin: 30px auto;
    max-width: 650px;
    box-shadow: 0 10px 25px rgba(0,0,0,.08);
}

h2 {
    color: #0D47A1;
    text-align: center;
    margin-top: 0;
    margin-bottom: 25px;
}

/* ช่องกรอกข้อมูล */
input,
select,
textarea {
    width: 100%;
    border: 1px solid #CFD8DC;
    border-radius: 10px;
    padding: 14px;
    font-size: 16px;
    margin-bottom: 15px;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #1976D2;
    box-shadow: 0 0 8px rgba(25,118,210,.2);
    outline: none;
}

/* กลุ่มปุ่มกด */
.button-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 10px;
}

button {
    width: 100%;
    background: #26A69A;
    color: white;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    padding: 15px;
    cursor: pointer;
    transition: background 0.2s;
}

button:hover {
    background: #00897B;
}

button:disabled {
    background: #B0BEC5;
    cursor: not-allowed;
}

/* ปุ่มดูคิวสำหรับคนไข้ */
.queue-btn {
    background: #0288D1;
}

.queue-btn:hover {
    background: #01579B;
}

/* ส่วนล่างสุด */
footer {
    text-align: center;
    padding: 20px;
    color: #78909C;
    font-size: 14px;
    margin-top: 40px;
}
.time-section {
    margin-bottom: 15px;
}

.time-label {
    display: block;
    color: #37474F;
    font-weight: 600;
    margin-bottom: 8px;
}

.time-toggle {
    background: #1976D2;
    padding: 12px 15px;
    font-size: 16px;
    margin-bottom: 8px;
}

.time-toggle:hover {
    background: #0D47A1;
}

.time-list {
    display: none;
    background: #F8FAFC;
    border: 1px solid #CFD8DC;
    border-radius: 10px;
    padding: 10px;
    max-height: 300px;
    overflow-y: auto;
}

.time-list.show {
    display: block;
}

.time-option {
    width: 100%;
    padding: 11px 14px;
    margin-bottom: 6px;
    border-radius: 8px;
    border: 1px solid #CFD8DC;
    background: white;
    color: #263238;
    text-align: left;
    font-size: 15px;
}

.time-option.available {
    background: #E8F5E9;
    border-color: #81C784;
    color: #2E7D32;
}

.time-option.available:hover {
    background: #C8E6C9;
}

.time-option.unavailable {
    background: #FFEBEE;
    border-color: #EF9A9A;
    color: #C62828;
    cursor: not-allowed;
    opacity: .75;
}

.time-option.selected {
    border: 2px solid #1976D2;
    background: #E3F2FD;
}

.time-status {
    float: right;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>🏥 ระบบจองคิวคลินิกออนไลน์</h1>
    <p>คลินิกรักษาโรคทั่วไป</p>
</header>

<div class="container">

<h2>แบบฟอร์มจองคิว</h2>

<input id="name" placeholder="ชื่อ-นามสกุล">
<input id="phone" placeholder="เบอร์โทรศัพท์">
<input id="email" placeholder="อีเมล (ถ้ามี)">
<textarea id="symptom" rows="4" placeholder="อาการหรือสาเหตุที่มาพบแพทย์ เช่น ไข้ ไอ เจ็บคอ ปวดท้อง"></textarea>

<input type="date" id="date">

<!-- เลือกเวลา -->
<div class="time-section">

    <label class="time-label">🕐 เลือกเวลานัดหมาย</label>

    <button
        type="button"
        id="timeToggle"
        class="time-toggle"
        onclick="toggleTimes()">
        เลือกเวลา ▼
    </button>

    <div id="timeList" class="time-list"></div>

    <input type="hidden" id="time">

</div>

<div class="button-group">
    <!-- ปุ่มจองคิว -->
    <button id="submitBtn" onclick="bookQueue()">
        📝 จองคิว
    </button>

    <!-- ปุ่มดูคิวสำหรับคนไข้ -->
    <a href="public-queue.html" style="text-decoration: none;">
        <button type="button" class="queue-btn">
            🔍 ดูรายการคิวผู้ป่วย
        </button>
    </a>
</div>

</div>

<footer>
    <p>© ระบบจองคิวคลินิกออนไลน์</p>
</footer>

<script>
// URL Apps Script ของคุณ
const API_URL = "https://script.google.com/macros/s/AKfycbw4N-c8P6tyoflEQ-O62G-G3mnskkmMW-BiZNkkt-LuVpwwznLkDtd3pahgME6FKCl2/exec";

async function bookQueue() {
    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const email = document.getElementById("email").value.trim();
    const symptom = document.getElementById("symptom").value.trim();
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;
    const submitBtn = document.getElementById("submitBtn");

    if (!name || !phone || !symptom || !date || !time) {
        alert("กรุณากรอกข้อมูลให้ครบถ้วน (ชื่อ, เบอร์โทร, อาการ, วันที่ และเวลา)");
        return;
    }

    // ปิดปุ่มกดชั่วคราวเพื่อป้องกันการกดซ้ำ
    submitBtn.disabled = true;
    submitBtn.innerText = "กำลังบันทึกข้อมูล...";

    const data = {
        action: "addBooking",
        name: name,
        phone: phone,
        email: email,
        symptom: symptom,
        date: date,
        time: time
    };

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.success) {
            alert(
                "🎉 จองคิวสำเร็จ!\n" +
                "หมายเลขคิวของคุณคือ: " + (result.queue || "บันทึกแล้ว")
            );

            // รีเซ็ตค่าในฟอร์ม
            document.getElementById("name").value = "";
            document.getElementById("phone").value = "";
            document.getElementById("email").value = "";
            document.getElementById("symptom").value = "";
            document.getElementById("date").value = "";
            document.getElementById("time").selectedIndex = 0;

        } else {
            alert("❌ เกิดข้อผิดพลาด: " + (result.message || "จองคิวไม่สำเร็จ"));
        }

    } catch (error) {
        console.error(error);
        alert("❌ ไม่สามารถเชื่อมต่อกับระบบได้ กรุณาลองใหม่อีกครั้ง");
    } finally {
        // คืนค่าปุ่มให้กดได้ปกติ
        submitBtn.disabled = false;
        submitBtn.innerText = "📝 จองคิว";
    }
}
// ==========================================
// เปิด / ปิดรายการเวลา
// ==========================================
function toggleTimes() {

    const list = document.getElementById("timeList");

    list.classList.toggle("show");

}


// ==========================================
// โหลดเวลาว่าง / ไม่ว่าง
// ==========================================
async function loadAvailableTimes() {

    const date = document.getElementById("date").value;

    const list = document.getElementById("timeList");
    const hiddenTime = document.getElementById("time");

    hiddenTime.value = "";

    document.getElementById("timeToggle").innerText =
        "กำลังตรวจสอบเวลา...";

    list.innerHTML = "";
    list.classList.add("show");


    if (!date) {

        list.innerHTML =
            '<div style="padding:12px;text-align:center;color:#78909C;">กรุณาเลือกวันที่ก่อน</div>';

        document.getElementById("timeToggle").innerText =
            "เลือกเวลา ▼";

        return;

    }


    try {

        const response = await fetch(
            API_URL +
            "?action=getAvailableTimes&date=" +
            encodeURIComponent(date)
        );

        const times = await response.json();

        list.innerHTML = "";


        times.forEach(item => {

            const button = document.createElement("button");

            button.type = "button";

            button.className =
                "time-option " +
                (item.available ? "available" : "unavailable");


            const status =
                item.available
                    ? "🟢 ว่าง"
                    : "🔴 ไม่ว่าง";


            button.innerHTML =
                "<strong>" + item.time + "</strong>" +
                '<span class="time-status">' +
                status +
                "</span>";


            if (item.available) {

                button.onclick = function() {

                    selectTime(item.time, button);

                };

            } else {

                button.disabled = true;

            }


            list.appendChild(button);

        });


        document.getElementById("timeToggle").innerText =
            "เลือกเวลา ▼";


    } catch (error) {

        console.error(error);

        list.innerHTML =
            '<div style="padding:12px;text-align:center;color:#C62828;">ไม่สามารถตรวจสอบเวลาว่างได้</div>';

        document.getElementById("timeToggle").innerText =
            "เลือกเวลา ▼";

    }

}


// ==========================================
// เลือกเวลา
// ==========================================
function selectTime(time, button) {

    document.getElementById("time").value = time;

    document.getElementById("timeToggle").innerText =
        "🕐 " + time + " ▼";


    document.querySelectorAll(".time-option")
        .forEach(btn => btn.classList.remove("selected"));


    button.classList.add("selected");


    document.getElementById("timeList")
        .classList.remove("show");

}


// ==========================================
// เมื่อเลือกวันที่
// ==========================================
document.getElementById("date").addEventListener(
    "change",
    function() {

        document.getElementById("time").value = "";

        loadAvailableTimes();

    }
);
</script>

</body>
</html>
